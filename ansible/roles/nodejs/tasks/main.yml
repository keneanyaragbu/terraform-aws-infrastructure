---
# Node.js installation for Amazon Linux

- name: Install Node.js prerequisites
  yum:
    name:
      - ca-certificates
    state: present

- name: Add NodeSource repository
  shell: |
    curl -fsSL https://rpm.nodesource.com/setup_{{ node_version }}.x | bash -
  args:
    creates: /etc/yum.repos.d/nodesource-el9.repo

- name: Install Node.js
  yum:
    name: nodejs
    state: present

- name: Create application user
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: yes
    state: present

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Copy application file
  copy:
    src: server.js
    dest: "{{ app_dir }}/server.js"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'

- name: Check if PM2 is installed
  command: which pm2
  register: pm2_check
  failed_when: false
  changed_when: false

- name: Install PM2 globally
  command: npm install -g pm2
  when: pm2_check.rc != 0

- name: Check if app is already managed by PM2
  command: pm2 describe {{ project_name }}
  register: pm2_app_check
  failed_when: false
  changed_when: false
  become_user: "{{ app_user }}"

- name: Start Node.js app with PM2
  command: pm2 start {{ app_dir }}/server.js --name {{ project_name }}
  become_user: "{{ app_user }}"
  environment:
    PORT: "{{ app_port }}"
  when: pm2_app_check.rc != 0

- name: Restart app with PM2 if already present
  command: pm2 restart {{ project_name }}
  become_user: "{{ app_user }}"
  environment:
    PORT: "{{ app_port }}"
  when: pm2_app_check.rc == 0

- name: Save PM2 process list
  command: pm2 save
  become_user: "{{ app_user }}"

- name: Get PM2 startup command
  command: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  register: pm2_startup
  changed_when: false

- name: Execute PM2 startup command
  shell: "{{ pm2_startup.stdout_lines[-1] }}"
  when: pm2_startup.stdout_lines | length > 0
  args:
    creates: /etc/systemd/system/pm2-{{ app_user }}.service

- name: Reload systemd and enable PM2 service
  systemd:
    name: "pm2-{{ app_user }}"
    enabled: yes
    daemon_reload: yes